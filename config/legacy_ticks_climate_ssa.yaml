# YOUR PROJECT — Tick-Borne Diseases / Climate / Sub-Saharan Africa
project:
  name: "ticks_climate_ssa"
  description: "From Climate Signals to Disease Emergence: One Health framework for predicting tick-borne diseases in SSA"
  contact_email: "cognosxx@gmail.com"

paths:
  base_dir: "/content/drive/MyDrive/ticks"
  data_subdir: "data"
  work_subdir: "preprocessing_data_v2"

io:
  format: "parquet"
  also_write_xlsx: false
  xlsx_max_rows: 200000

sources:
  - {label: "PubMed",               aliases: ["pubmed","medline","ncbi"]}
  - {label: "Europe PMC",           aliases: ["europepmc","epmc","europe pmc"]}
  - {label: "OpenAlex",             aliases: ["openalex"]}
  - {label: "Lens.org",             aliases: ["lens","lens.org"]}
  - {label: "Scopus",               aliases: ["scopus"]}
  - {label: "Web of Science",       aliases: ["wos","web of science","woscc"]}
  - {label: "Dimensions",           aliases: ["dimensions"]}
  - {label: "Global Index Medicus", aliases: ["gim","global index medicus"]}

ingest: {dedupe_within_source: true, prune_low_coverage_below: 0.15}
type_filter: {keep_case_reports: true}
year_filter: {min_year: 2000, keep_missing_year: true}

enrich:
  use_openalex: true
  use_crossref: true
  use_unpaywall: true
  use_europepmc: true
  use_semantic_scholar: false   # not used by the chunked enricher's current passes
  title_fallback: true
  title_min_score: 92
  checkpoint_every: 500
  chunk_size: 25000   # rows per self-contained enriched chunk (lower if RAM tight)
  workers: 8          # parallel API workers for per-record passes

dedupe:
  fuzzy_threshold: 90
  fuzzy_year_tolerance: 2
  author_fp_mode: "last_initial"
  merge_versions_sharing_oaid: true

domain:
  focus_region_name: "Sub-Saharan Africa"
  focus_countries: ["NG","KE","GH","TZ","ET","UG","ZA","CM","SN","CI","ML","BF","ZM","ZW",
    "MZ","AO","RW","BJ","BW","NA","MW","SD","CD","GA","TD","NE","SO","MG","SL","TG","GN",
    "ER","BI","LS","SZ","GM","LR","MR"]

screening:
  enabled: true
  question: "Does this study EVALUATE THE IMPACT OF CLIMATE ON TICKS?"
  criteria: |
    INCLUSION: Does this study evaluate the impact of climate (weather, temperature,
    humidity, rainfall, seasonality, climate change) on ticks (tick populations,
    distribution, abundance, activity, phenology, or climate-driven tick-borne disease
    transmission)? To INCLUDE, ALL THREE must be true: (1) about ticks/vectors;
    (2) involves a climate/weather/environmental/seasonal variable; (3) actually ASSESSES
    a relationship/effect between them (mere mention is NOT enough). Apply STRICT
    interpretation; if only incidental/speculative, EXCLUDE. If unsure, mark "uncertain".
  reason_codes: ["INCLUDE","EXCLUDE_NOT_TICKS","EXCLUDE_NO_CLIMATE","EXCLUDE_NO_IMPACT","EXCLUDE_WRONG_TYPE","UNCERTAIN"]
  consensus_rule: "any_include"
  uncertain_to_human: true
  disagreement_to_human: true
  models:
    - {provider: "openai",    model: "gpt-4o-mini"}
    - {provider: "anthropic", model: "claude-sonnet-4-6"}
    - {provider: "google",    model: "gemini-2.5-flash"}
  checkpoint_every: 100

validation: {sample_size: 250, target_sensitivity: 0.95}

# ---- bibliometric / science-of-science analysis stages (post-screening) ----
topic_model:
  only_tick_relevant: true
  # MULTILINGUAL embeddings: French/Portuguese/Spanish/Russian/Chinese/Arabic
  # papers cluster by scientific THEME, not by language. No translation/API cost.
  # Lighter option if RAM-tight: "paraphrase-multilingual-MiniLM-L12-v2".
  embed_model: "paraphrase-multilingual-mpnet-base-v2"
  min_topic_size: 150               # raise for broader topics, lower for finer granularity
  reduce_outliers: true

# corpus finalisation + analysis assets
analysis:
  max_year: 2026                    # drop future-dated metadata errors above this
  # per-project taxonomy: relabels topics + flags NON-TICK homonym clusters to drop.
  # path is relative to the WORK dir (upload topic_taxonomy.csv there), or absolute.
  topic_taxonomy_csv: "topic_taxonomy.csv"
  # fallback if no taxonomy csv present: explicit topic ids to drop as noise
  noise_topic_ids: [3, 5, 8, 13, 21, 23, 35, 38]

layer3:
  min_n_per_year: 20   # years with fewer tick-relevant papers are flagged unreliable, not dropped
